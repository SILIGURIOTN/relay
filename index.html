<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Greenfield Smart Street Light</title>


<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {

    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    color: white;

    background:
        radial-gradient(
            circle at 50% 10%,
            #263967,
            #101b35 35%,
            #050913 75%,
            #02040a
        );

    overflow-x: hidden;
}


/* =========================================================
   LOGIN
========================================================= */

#loginScreen {

    position: fixed;

    inset: 0;

    z-index: 9999;

    display: flex;

    justify-content: center;

    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #1c315a,
            #03060e 70%
        );
}


.loginBox {

    width: min(90%, 390px);

    padding: 38px 30px;

    text-align: center;

    border-radius: 28px;

    background:
        rgba(12, 22, 44, 0.90);

    border:
        1px solid rgba(255,255,255,0.12);

    box-shadow:
        0 30px 100px rgba(0,0,0,0.7);

    backdrop-filter: blur(18px);

    animation:
        loginIn .7s ease;
}


@keyframes loginIn {

    from {
        opacity: 0;
        transform: scale(.92) translateY(25px);
    }

    to {
        opacity: 1;
        transform: scale(1) translateY(0);
    }
}


.loginLamp {

    font-size: 65px;

    margin-bottom: 10px;

    animation:
        floatLamp 3s ease-in-out infinite;
}


@keyframes floatLamp {

    0%,100% {
        transform: translateY(0);
    }

    50% {
        transform: translateY(-8px);
    }
}


.loginBox h1 {

    font-size: 28px;

    margin-bottom: 8px;
}


.loginBox p {

    color: #8d9bb8;

    font-size: 14px;

    margin-bottom: 25px;
}


#password {

    width: 100%;

    padding: 15px;

    border-radius: 13px;

    border:
        1px solid #36425d;

    background: #070d1c;

    color: white;

    outline: none;

    text-align: center;

    font-size: 17px;
}


#password:focus {

    border-color: #ffd84c;

    box-shadow:
        0 0 18px rgba(255,215,70,.18);
}


.loginButton {

    width: 100%;

    padding: 15px;

    margin-top: 15px;

    border: none;

    border-radius: 13px;

    background:
        linear-gradient(
            135deg,
            #ffe45d,
            #ff9f18
        );

    color: #171000;

    font-weight: bold;

    font-size: 15px;

    cursor: pointer;
}


#error {

    display: none;

    margin-top: 13px;

    color: #ff6565;

    font-size: 13px;
}


/* =========================================================
   APP
========================================================= */

#app {

    display: none;

    min-height: 100vh;

    padding-bottom: 30px;

    position: relative;
}


/* =========================================================
   STARS
========================================================= */

.stars {

    position: fixed;

    inset: 0;

    pointer-events: none;
}


.star {

    position: absolute;

    width: 2px;

    height: 2px;

    background: white;

    border-radius: 50%;

    opacity: .5;

    animation:
        twinkle 3s infinite alternate;
}


@keyframes twinkle {

    from {
        opacity: .15;
    }

    to {
        opacity: .85;
    }
}


/* =========================================================
   HEADER
========================================================= */

.header {

    text-align: center;

    padding:
        28px 15px 5px;

    position: relative;

    z-index: 2;
}


.header h1 {

    font-size:
        clamp(26px, 6vw, 42px);
}


.header p {

    color: #8b99b6;

    margin-top: 7px;

    font-size: 14px;
}


/* =========================================================
   CONNECTION
========================================================= */

.statusBar {

    margin-top: 13px;

    display: flex;

    justify-content: center;
}


.statusPill {

    display: flex;

    align-items: center;

    gap: 8px;

    padding:
        7px 14px;

    border-radius: 30px;

    background:
        rgba(255,255,255,.055);

    border:
        1px solid rgba(255,255,255,.08);

    color: #a6b1c8;

    font-size: 12px;
}


.statusDot {

    width: 8px;

    height: 8px;

    border-radius: 50%;

    background: #777;
}


.statusDot.connected {

    background: #42e38d;

    box-shadow:
        0 0 12px #42e38d;

    animation:
        connectionPulse 1.5s infinite;
}


@keyframes connectionPulse {

    50% {
        opacity: .35;
    }
}


/* =========================================================
   CARD
========================================================= */

.controlCard {

    width: min(92%, 530px);

    margin:
        25px auto;

    padding:
        25px 20px 30px;

    text-align: center;

    position: relative;

    z-index: 2;

    border-radius: 30px;

    background:
        rgba(12, 22, 44, .75);

    border:
        1px solid rgba(255,255,255,.10);

    box-shadow:
        0 25px 80px rgba(0,0,0,.5);

    backdrop-filter: blur(15px);

    transition:
        box-shadow .5s;
}


/* =========================================================
   STREET
========================================================= */

.streetScene {

    height: 285px;

    position: relative;

    overflow: hidden;

    border-radius: 25px;

    background:
        linear-gradient(
            to bottom,
            rgba(8,14,30,.05),
            rgba(4,8,17,.65)
        );
}


/* Moon */

.moon {

    position: absolute;

    right: 42px;

    top: 24px;

    width: 65px;

    height: 65px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 35% 30%,
            #fffde8,
            #e7dda9
        );

    box-shadow:
        0 0 40px rgba(255,245,180,.35);
}


/* Road */

.road {

    position: absolute;

    left: 0;

    right: 0;

    bottom: 0;

    height: 70px;

    background:
        linear-gradient(
            #191e2a,
            #080b12
        );
}


.roadLine {

    position: absolute;

    left: 0;

    right: 0;

    top: 34px;

    height: 4px;

    opacity: .3;

    background:
        repeating-linear-gradient(
            90deg,
            #aaa 0,
            #aaa 35px,
            transparent 35px,
            transparent 75px
        );
}


/* =========================================================
   LAMP
========================================================= */

.lampPost {

    position: absolute;

    left: 50%;

    bottom: 48px;

    width: 9px;

    height: 205px;

    transform:
        translateX(-50%);

    border-radius: 10px;

    background:
        linear-gradient(
            90deg,
            #171b25,
            #69717f,
            #171b25
        );
}


.lampArm {

    position: absolute;

    top: 0;

    left: 2px;

    width: 105px;

    height: 8px;

    border-radius: 8px;

    background:
        linear-gradient(
            90deg,
            #1b1f28,
            #6b7280,
            #1b1f28
        );

    transform:
        rotate(-4deg);
}


.lampHead {

    position: absolute;

    left: 92px;

    top: 0;

    width: 37px;

    height: 16px;

    border-radius:
        10px 10px 5px 5px;

    background: #202632;

    border:
        2px solid #596273;
}


.lampBulb {

    position: absolute;

    left: 104px;

    top: 11px;

    width: 13px;

    height: 13px;

    border-radius: 50%;

    background: #313746;

    transition:
        .5s;
}


/* =========================================================
   BEAM
========================================================= */

.lightBeam {

    position: absolute;

    top: 9px;

    left: calc(50% + 30px);

    width: 180px;

    height: 230px;

    transform:
        translateX(-50%);

    clip-path:
        polygon(
            38% 0,
            58% 0,
            100% 100%,
            0 100%
        );

    background:
        linear-gradient(
            to bottom,
            rgba(255,220,80,.38),
            rgba(255,210,60,.10),
            transparent
        );

    opacity: 0;

    filter: blur(4px);

    transition:
        opacity .7s;
}


.light-on .lightBeam {

    opacity: 1;

    animation:
        beamPulse 2s infinite;
}


@keyframes beamPulse {

    0%,100% {
        opacity: .65;
    }

    50% {
        opacity: 1;
    }
}


.light-on .lampBulb {

    background: #fff6a5;

    box-shadow:
        0 0 10px #fff6a5,
        0 0 25px #ffd84d,
        0 0 50px #ffad00;
}


.light-on {

    background:
        radial-gradient(
            circle at 53% 45%,
            rgba(255,211,65,.08),
            transparent 45%
        );
}


.light-on + .currentStatus {

    color: #ffe46b;
}


/* =========================================================
   STATUS TEXT
========================================================= */

.currentStatus {

    margin-top: 5px;

    font-size: 38px;

    font-weight: 900;

    letter-spacing: 3px;

    color: #78839b;

    transition:
        .4s;
}


.currentStatus.on {

    color: #ffe36c;

    text-shadow:
        0 0 25px rgba(255,220,80,.55);
}


#loading {

    margin-top: 7px;

    color: #8995ad;

    font-size: 12px;
}


/* =========================================================
   SWITCH
========================================================= */

.switchArea {

    margin-top: 25px;
}


.switch {

    position: relative;

    display: inline-block;

    width: 150px;

    height: 70px;
}


.switch input {

    opacity: 0;

    width: 0;

    height: 0;
}


.slider {

    position: absolute;

    inset: 0;

    cursor: pointer;

    border-radius: 50px;

    background:
        linear-gradient(
            135deg,
            #293146,
            #111827
        );

    border:
        2px solid #3b465e;

    transition: .4s;
}


.slider:before {

    content: "";

    position: absolute;

    left: 6px;

    top: 6px;

    width: 54px;

    height: 54px;

    border-radius: 50%;

    background:
        linear-gradient(
            145deg,
            #9ba4b4,
            #4b566c
        );

    box-shadow:
        0 5px 15px rgba(0,0,0,.5);

    transition: .4s;
}


input:checked + .slider {

    background:
        linear-gradient(
            135deg,
            #ffe65e,
            #ff9f1a
        );

    border-color: #ffe15a;

    box-shadow:
        0 0 28px rgba(255,207,55,.4);
}


input:checked + .slider:before {

    transform:
        translateX(80px);

    background:
        #fff7bd;

    box-shadow:
        0 0 20px rgba(255,238,140,.9);
}


.switchLabels {

    width: 150px;

    margin:
        7px auto 0;

    display: flex;

    justify-content:
        space-between;

    color: #77839a;

    font-size: 11px;

    font-weight: bold;
}


/* =========================================================
   INFO
========================================================= */

.info {

    width: min(92%, 530px);

    margin:
        0 auto;

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 12px;

    position: relative;

    z-index: 2;
}


.infoBox {

    padding: 16px;

    text-align: center;

    border-radius: 18px;

    background:
        rgba(255,255,255,.045);

    border:
        1px solid rgba(255,255,255,.07);
}


.label {

    color: #73809a;

    font-size: 10px;

    text-transform: uppercase;

    letter-spacing: 1px;
}


.value {

    margin-top: 7px;

    font-size: 15px;

    font-weight: bold;
}


@media(max-width:450px) {

    .controlCard {
        padding: 18px 12px 25px;
    }

    .streetScene {
        height: 260px;
    }

    .currentStatus {
        font-size: 31px;
    }

}

</style>

</head>


<body>


<!-- =======================================================
     LOGIN
======================================================= -->

<div id="loginScreen">

    <div class="loginBox">

        <div class="loginLamp">
            💡
        </div>

        <h1>
            Smart Street Light
        </h1>

        <p>
            Greenfield Remote Control
        </p>

        <input
            id="password"
            type="password"
            placeholder="Enter password"
        >

        <button
            class="loginButton"
            onclick="login()"
        >
            ENTER DASHBOARD
        </button>

        <div id="error">
            Incorrect password
        </div>

    </div>

</div>


<!-- =======================================================
     APP
======================================================= -->

<div id="app">

    <div
        class="stars"
        id="stars">
    </div>


    <div class="header">

        <h1>
            🌙 Smart Street Light
        </h1>

        <p>
            Remote Lighting Control
        </p>


        <div class="statusBar">

            <div class="statusPill">

                <span
                    id="connectionDot"
                    class="statusDot">
                </span>

                <span id="connectionText">
                    Connecting...
                </span>

            </div>

        </div>

    </div>


    <!-- ===================================================
         CONTROL
    ==================================================== -->

    <div
        class="controlCard"
        id="controlCard"
    >

        <div
            class="streetScene"
            id="streetScene"
        >

            <div class="moon"></div>

            <div class="lightBeam"></div>

            <div class="lampPost">

                <div class="lampArm"></div>

                <div class="lampHead"></div>

                <div class="lampBulb"></div>

            </div>

            <div class="road">

                <div class="roadLine"></div>

            </div>

        </div>


        <div
            id="currentStatus"
            class="currentStatus"
        >
            OFF
        </div>


        <div id="loading">
            Reading current status...
        </div>


        <div class="switchArea">

            <label class="switch">

                <input
                    id="relaySwitch"
                    type="checkbox"
                    onchange="toggleRelay()"
                >

                <span class="slider"></span>

            </label>


            <div class="switchLabels">

                <span>OFF</span>

                <span>ON</span>

            </div>

        </div>

    </div>


    <!-- ===================================================
         INFO
    ==================================================== -->

    <div class="info">

        <div class="infoBox">

            <div class="label">
                Street Light
            </div>

            <div
                class="value"
                id="relayValue"
            >
                --
            </div>

        </div>


        <div class="infoBox">

            <div class="label">
                Last Update
            </div>

            <div
                class="value"
                id="lastUpdate"
            >
                --
            </div>

        </div>

    </div>

</div>


<script>


// =========================================================
// SETTINGS
// =========================================================

const AIO_USERNAME = "Greenfield";

/*
 IMPORTANT:
 Paste your PREVIOUS Adafruit IO key here.
*/
const AIO_KEY =
    "PASTE_YOUR_PREVIOUS_ADAFRUIT_KEY_HERE";


const PASSWORD = "1234";

const RELAY_FEED = "relay";

const STATUS_FEED = "relay-status";


// Check Adafruit IO every 3 seconds
const UPDATE_INTERVAL = 3000;


// Prevent multiple commands at the same time
let commandBusy = false;


// =========================================================
// LOGIN
// =========================================================

function login()
{
    const password =
        document.getElementById("password").value;

    if (password === PASSWORD)
    {
        document.getElementById(
            "loginScreen"
        ).style.display = "none";

        document.getElementById(
            "app"
        ).style.display = "block";

        createStars();

        getCurrentStatus();

        setInterval(
            getCurrentStatus,
            UPDATE_INTERVAL
        );
    }
    else
    {
        document.getElementById(
            "error"
        ).style.display = "block";

        document.getElementById(
            "password"
        ).value = "";
    }
}


// Enter key

document
    .getElementById("password")
    .addEventListener(
        "keydown",
        function(event)
        {
            if (event.key === "Enter")
            {
                login();
            }
        }
    );


// =========================================================
// API HEADERS
// =========================================================

function apiHeaders()
{
    return {
        "X-AIO-Key": AIO_KEY,
        "Content-Type": "application/json"
    };
}


// =========================================================
// READ CURRENT STATE
// =========================================================

async function getCurrentStatus()
{
    try
    {
        const url =
            "https://io.adafruit.com/api/v2/" +
            AIO_USERNAME +
            "/feeds/" +
            RELAY_FEED +
            "/data/last";


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    headers: apiHeaders(),
                    cache: "no-store"
                }
            );


        if (!response.ok)
        {
            throw new Error(
                "Adafruit IO error"
            );
        }


        const data =
            await response.json();


        const value =
            String(data.value)
            .trim()
            .toUpperCase();


        const state =
            (
                value === "ON" ||
                value === "1"
            );


        updateInterface(state);

        setConnection(true);


        document.getElementById(
            "loading"
        ).textContent =
            "Live status synchronized";


        document.getElementById(
            "lastUpdate"
        ).textContent =
            new Date().toLocaleTimeString();

    }
    catch(error)
    {
        console.error(error);

        setConnection(false);

        document.getElementById(
            "loading"
        ).textContent =
            "Connection problem";
    }
}


// =========================================================
// SEND COMMAND
// =========================================================

async function sendCommand(state)
{
    if (commandBusy)
    {
        return;
    }

    commandBusy = true;


    const value =
        state ? "ON" : "OFF";


    try
    {
        const url =
            "https://io.adafruit.com/api/v2/" +
            AIO_USERNAME +
            "/feeds/" +
            RELAY_FEED +
            "/data";


        const response =
            await fetch(
                url,
                {
                    method: "POST",

                    headers:
                        apiHeaders(),

                    body:
                        JSON.stringify({
                            value: value
                        })
                }
            );


        if (!response.ok)
        {
            throw new Error(
                "Command rejected"
            );
        }


        setConnection(true);


        document.getElementById(
            "loading"
        ).textContent =
            "Command sent successfully";


        document.getElementById(
            "lastUpdate"
        ).textContent =
            new Date().toLocaleTimeString();


        // Wait briefly for ESP32 to process command
        setTimeout(
            getCurrentStatus,
            1000
        );

    }
    catch(error)
    {
        console.error(error);

        document.getElementById(
            "loading"
        ).textContent =
            "Command failed";

        setConnection(false);

        // Read actual state again
        getCurrentStatus();
    }
    finally
    {
        commandBusy = false;
    }
}


// =========================================================
// TOGGLE
// =========================================================

function toggleRelay()
{
    const checkbox =
        document.getElementById(
            "relaySwitch"
        );


    const state =
        checkbox.checked;


    updateInterface(state);

    sendCommand(state);
}


// =========================================================
// UPDATE INTERFACE
// =========================================================

function updateInterface(state)
{
    const checkbox =
        document.getElementById(
            "relaySwitch"
        );


    const scene =
        document.getElementById(
            "streetScene"
        );


    const status =
        document.getElementById(
            "currentStatus"
        );


    const relayValue =
        document.getElementById(
            "relayValue"
        );


    checkbox.checked = state;


    if (state)
    {
        scene.classList.add(
            "light-on"
        );

        status.classList.add(
            "on"
        );

        status.textContent =
            "ON";

        relayValue.textContent =
            "ACTIVE";
    }
    else
    {
        scene.classList.remove(
            "light-on"
        );

        status.classList.remove(
            "on"
        );

        status.textContent =
            "OFF";

        relayValue.textContent =
            "OFF";
    }
}


// =========================================================
// CONNECTION INDICATOR
// =========================================================

function setConnection(connected)
{
    const dot =
        document.getElementById(
            "connectionDot"
        );


    const text =
        document.getElementById(
            "connectionText"
        );


    if (connected)
    {
        dot.classList.add(
            "connected"
        );

        text.textContent =
            "Adafruit IO Connected";
    }
    else
    {
        dot.classList.remove(
            "connected"
        );

        text.textContent =
            "Connection Error";
    }
}


// =========================================================
// STARS
// =========================================================

function createStars()
{
    const container =
        document.getElementById(
            "stars"
        );


    for (
        let i = 0;
        i < 80;
        i++
    )
    {
        const star =
            document.createElement(
                "div"
            );


        star.className =
            "star";


        star.style.left =
            Math.random() * 100 +
            "%";


        star.style.top =
            Math.random() * 75 +
            "%";


        star.style.animationDelay =
            Math.random() * 3 +
            "s";


        container.appendChild(
            star
        );
    }
}

</script>

</body>

</html>

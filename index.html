<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Greenfield Street Light</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;background:#06100d;color:#fff}
#loginScreen{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 20%,rgba(0,255,170,.16),transparent 35%),linear-gradient(145deg,#020807,#071814 55%,#020706)}
.loginBox{width:88%;max-width:380px;padding:34px 24px;border:1px solid rgba(0,255,180,.25);border-radius:28px;background:rgba(7,24,19,.9);backdrop-filter:blur(20px);box-shadow:0 0 50px rgba(0,255,170,.12);text-align:center}.loginLogo{width:72px;height:72px;margin:auto auto 18px;border-radius:22px;display:flex;align-items:center;justify-content:center;font-size:32px;background:linear-gradient(145deg,#0cff9b,#087052);box-shadow:0 0 35px rgba(0,255,160,.35)}.loginTitle{font-size:25px;font-weight:700}.loginSub{margin:7px 0 28px;font-size:11px;letter-spacing:3px;color:#72dcb9}.inputBox{margin-bottom:14px}.inputBox input{width:100%;height:50px;border:1px solid rgba(255,255,255,.1);border-radius:14px;outline:none;background:rgba(0,0,0,.28);color:white;padding:0 16px;font-size:15px}.loginButton{width:100%;height:52px;margin-top:8px;border:0;border-radius:15px;background:linear-gradient(90deg,#00e88f,#00a968);color:#00150e;font-weight:800;font-size:15px}.loginError{min-height:20px;margin-top:13px;font-size:12px;color:#ff7373}
#appContent{display:none;position:fixed;inset:0;overflow:hidden;background:linear-gradient(#55bfe9 0%,#bdebf4 48%,#73b77e 74%,#254b31 100%);transition:background 1.5s ease,filter 1.5s ease}#appContent.morning{background:linear-gradient(#f7b56b,#f8dca0 35%,#8bc3a1 72%,#31543d)}#appContent.day{background:linear-gradient(#55bfe9,#bdebf4 48%,#73b77e 74%,#254b31)}#appContent.evening{background:linear-gradient(#ef765e,#7c668f 40%,#293f4e 72%,#0d2119)}#appContent.night{background:linear-gradient(#07142f,#102b45 42%,#10271e 72%,#030807)}
.sky{position:absolute;inset:0;overflow:hidden}.sun{position:absolute;width:75px;height:75px;right:35px;top:75px;border-radius:50%;background:#fff2a8;box-shadow:0 0 30px #ffe88a,0 0 80px rgba(255,220,90,.4);opacity:0;transition:opacity 1s}.day .sun,.morning .sun,.evening .sun{opacity:1}.night .sun{opacity:0}.moon{position:absolute;width:68px;height:68px;right:35px;top:65px;border-radius:50%;background:#f3fff1;box-shadow:0 0 30px rgba(230,255,220,.35);opacity:0;transition:opacity 1s}.night .moon,.evening .moon{opacity:1}.star{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:0;animation:twinkle 3s infinite alternate}.night .star,.evening .star{opacity:.8}@keyframes twinkle{to{opacity:.2}}
.header{position:absolute;z-index:30;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:center}.brand{display:flex;gap:10px;align-items:center}.brandIcon{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:rgba(0,255,170,.12);border:1px solid rgba(0,255,170,.25)}.brandText{font-size:15px;font-weight:700}.brandSub{font-size:8px;letter-spacing:2px;color:#7ccab3;margin-top:3px}.connection{padding:8px 11px;border-radius:20px;background:rgba(0,0,0,.28);font-size:9px;font-weight:700;letter-spacing:1px}.connection.live{color:#00ff9d}.connection.offline{color:#ff7777}.weather{position:absolute;z-index:30;top:90px;left:18px;padding:9px 13px;border-radius:18px;background:rgba(0,0,0,.22);border:1px solid rgba(255,255,255,.08);backdrop-filter:blur(10px);font-size:10px;color:#d8fff1;max-width:calc(100% - 36px)}
.cloud{position:absolute;width:150px;height:45px;border-radius:50px;background:rgba(235,245,250,.72);filter:blur(1px);z-index:4;opacity:0;animation:cloudMove 35s linear infinite}.cloud:before,.cloud:after{content:"";position:absolute;border-radius:50%;background:inherit}.cloud:before{width:70px;height:70px;left:28px;top:-32px}.cloud:after{width:58px;height:58px;right:20px;top:-23px}.cloudy .cloud,.rainy .cloud,.storm .cloud{opacity:.9}@keyframes cloudMove{from{transform:translateX(-220px)}to{transform:translateX(calc(100vw + 220px))}}
.wind{position:absolute;width:90px;height:2px;background:rgba(220,255,245,.4);border-radius:3px;z-index:8;opacity:0;animation:windMove 1.8s linear infinite}.windy .wind,.rainy .wind,.storm .wind{opacity:1}@keyframes windMove{from{transform:translateX(-120px);opacity:0}25%{opacity:.8}to{transform:translateX(110vw);opacity:0}}
.rain{position:absolute;inset:0;pointer-events:none;z-index:15}.drop{position:absolute;width:1px;height:22px;background:linear-gradient(transparent,rgba(150,220,255,.65));animation:rainFall 1s linear infinite}@keyframes rainFall{to{transform:translateY(100vh)}}.flash{position:absolute;inset:0;background:#fff;z-index:25;opacity:0;pointer-events:none}.storm .flash{animation:flash 7s infinite}@keyframes flash{0%,92%,96%,100%{opacity:0}93%,95%{opacity:.2}}
.ground{position:absolute;left:0;right:0;bottom:0;height:43%;background:linear-gradient(to top,#010403,#06110d 60%,transparent)}.road{position:absolute;left:-20%;right:-20%;bottom:-5%;height:30%;transform:perspective(300px) rotateX(35deg);background:linear-gradient(#0c1613,#050807);border-top:1px solid rgba(255,255,255,.05)}.roadLine{position:absolute;left:50%;bottom:10%;width:7px;height:90px;transform:translateX(-50%);background:rgba(220,255,210,.4);box-shadow:0 120px 0 rgba(220,255,210,.25),0 240px 0 rgba(220,255,210,.12)}
.tree{position:absolute;bottom:27%;width:90px;height:180px;animation:sway 4s ease-in-out infinite alternate;transform-origin:bottom center;z-index:6}.tree1{left:-10px;transform:scale(.8)}.tree2{left:17%;transform:scale(.65)}.tree3{right:15%;transform:scale(.75)}.tree4{right:-15px;transform:scale(.9)}.trunk{position:absolute;bottom:0;left:44%;width:10px;height:85px;border-radius:8px;background:#39291d}.leaf{position:absolute;width:75px;height:75px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#2ecf78,#07572f 65%,#032d1b)}.leaf.a{left:5px;top:35px}.leaf.b{left:35px;top:15px}.leaf.c{left:0;top:-10px}@keyframes sway{from{rotate:-2deg}to{rotate:2deg}}.tree5{left:4%;transform:scale(.52)}.tree6{left:27%;transform:scale(.48)}.tree7{right:27%;transform:scale(.55)}.tree8{right:3%;transform:scale(.5)}.tree5 .leaf,.tree6 .leaf{border-radius:45% 55% 48% 52%;background:radial-gradient(circle at 40% 30%,#52d889,#0b6638 65%,#04351f)}.tree7 .leaf{border-radius:50% 50% 38% 62%;background:radial-gradient(circle at 40% 30%,#8ee08b,#26723c 62%,#103d25)}.tree8 .leaf{width:62px;height:62px;background:radial-gradient(circle at 35% 30%,#d0e88b,#507b32 65%,#243d20)}.tree5 .trunk,.tree6 .trunk{width:7px;height:65px}.tree7 .trunk,.tree8 .trunk{width:8px;height:70px}
.lamp{position:absolute;bottom:28%;width:6px;height:190px;border-radius:8px;background:linear-gradient(to right,#18231f,#60736a,#101714);z-index:10}.lamp1{left:12%}.lamp2{left:35%}.lamp3{right:35%}.lamp4{right:12%}.lampHead{position:absolute;top:-5px;left:-8px;width:22px;height:8px;border-radius:8px;background:#53655c}.lampHead{box-shadow:0 0 3px rgba(255,255,255,.25)}.lampLight{position:absolute;top:1px;left:1px;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle,#ffffff 0%,#fff7bd 35%,#ffc94d 65%,rgba(255,170,40,.1) 100%);opacity:0;transition:.4s}.lights-on .lampLight{opacity:1;box-shadow:0 0 8px #fff,0 0 22px #fff3a1,0 0 45px #ffd45c,0 0 85px rgba(255,170,40,.8);animation:lampGlow 1.8s ease-in-out infinite alternate}.lights-on .lightPool{opacity:1}.lightPool{position:absolute;bottom:27%;width:130px;height:42px;border-radius:50%;background:radial-gradient(ellipse,rgba(255,220,120,.58),transparent 70%);filter:blur(5px);opacity:0;transition:.4s}.pool1{left:7%}.pool2{left:30%}.pool3{right:30%}.pool4{right:7%}@keyframes lampGlow{to{transform:scale(1.1);opacity:.8}}
.panel{position:absolute;z-index:40;left:15px;right:15px;bottom:15px;padding:18px;border-radius:24px;background:rgba(5,20,16,.86);border:1px solid rgba(0,255,170,.17);backdrop-filter:blur(18px);box-shadow:0 15px 50px rgba(0,0,0,.45)}.panelTop{display:flex;justify-content:space-between;align-items:center}.panelTitle{font-size:15px;font-weight:700}.panelSub{margin-top:4px;font-size:9px;color:#78bca8;letter-spacing:1px}.toggle{width:58px;height:32px;border-radius:20px;padding:3px;background:#18231f;border:1px solid rgba(255,255,255,.1);cursor:pointer}.toggleKnob{width:24px;height:24px;border-radius:50%;background:#6b7873;transition:.25s}.toggle.on{background:#00b96f}.toggle.on .toggleKnob{transform:translateX(24px);background:white;box-shadow:0 0 15px rgba(0,255,160,.7)}.stateRow{display:flex;align-items:center;gap:9px;margin-top:15px}.stateDot{width:9px;height:9px;border-radius:50%;background:#ff6464}.stateDot.on{background:#00ff9d;box-shadow:0 0 10px #00ff9d}.stateText{font-size:12px;font-weight:700}.infoGrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:13px}.info{padding:10px;border-radius:13px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.05)}.infoLabel{font-size:8px;color:#6f988a;text-transform:uppercase;letter-spacing:1px}.infoValue{margin-top:5px;font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.message{margin-top:10px;min-height:15px;font-size:9px;color:#8ab9a9}
@media(max-width:430px){.lamp{height:155px}.tree{bottom:28%}.panel{bottom:10px;padding:14px}}
</style>
</head>
<body>
<div id="loginScreen"><div class="loginBox"><div class="loginLogo">💡</div><div class="loginTitle">Greenfield</div><div class="loginSub">SMART STREET LIGHT</div><div class="inputBox"><input id="username" placeholder="Username" autocomplete="username"></div><div class="inputBox"><input id="password" type="password" placeholder="Password" autocomplete="current-password"></div><button class="loginButton" id="loginButton">ENTER DASHBOARD</button><div class="loginError" id="loginError"></div></div></div>
<div id="appContent">
<div class="sky"><div class="sun"></div><div class="moon"></div><span class="star" style="left:8%;top:14%"></span><span class="star" style="left:18%;top:25%"></span><span class="star" style="left:30%;top:12%"></span><span class="star" style="left:44%;top:20%"></span><span class="star" style="left:57%;top:10%"></span><span class="star" style="left:72%;top:24%"></span></div>
<div class="header"><div class="brand"><div class="brandIcon">💡</div><div><div class="brandText">Greenfield Street Light</div><div class="brandSub">SILIGURI SMART LIGHTING</div></div></div><div id="connection" class="connection">CHECKING</div></div>
<div id="weather" class="weather">🌤️ Loading Siliguri weather...</div><div id="rain" class="rain"></div><div class="cloud" style="top:16%;animation-delay:-8s"></div><div class="cloud" style="top:30%;animation-delay:-22s"></div><div class="wind" style="top:24%;animation-delay:-.4s"></div><div class="wind" style="top:38%;animation-delay:-1.1s;width:120px"></div><div class="flash"></div>
<div class="ground"></div><div class="road"><div class="roadLine"></div></div>
<div class="tree tree1"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree2"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree3"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree4"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree5"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree6"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree7"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div><div class="tree tree8"><div class="trunk"></div><div class="leaf a"></div><div class="leaf b"></div><div class="leaf c"></div></div>
<div class="lamp lamp1"><div class="lampHead"></div><div class="lampLight"></div></div><div class="lamp lamp2"><div class="lampHead"></div><div class="lampLight"></div></div><div class="lamp lamp3"><div class="lampHead"></div><div class="lampLight"></div></div><div class="lamp lamp4"><div class="lampHead"></div><div class="lampLight"></div></div><div class="lightPool pool1"></div><div class="lightPool pool2"></div><div class="lightPool pool3"></div><div class="lightPool pool4"></div>
<div class="panel"><div class="panelTop"><div><div class="panelTitle">Greenfield Street Lights</div><div class="panelSub">FIREBASE REMOTE CONTROL</div></div><button id="toggleButton" class="toggle" type="button"><div class="toggleKnob"></div></button></div><div class="stateRow"><div id="stateDot" class="stateDot"></div><div id="stateText" class="stateText">OFF</div></div><div class="infoGrid"><div class="info"><div class="infoLabel">Last ON</div><div id="lastOn" class="infoValue">--</div></div><div class="info"><div class="infoLabel">Live Time</div><div id="liveTime" class="infoValue">--</div></div><div class="info"><div class="infoLabel">Firebase</div><div id="firebaseState" class="infoValue">WAIT</div></div></div><div id="message" class="message">Ready</div></div>
</div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getDatabase,ref,onValue,set} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
const firebaseConfig={apiKey:"AIzaSyBXDWp3eW4Tw8IrDLXxHVqOTW5UQWQwA",authDomain:"esp32-29f82.firebaseapp.com",databaseURL:"https://esp32-29f82-default-rtdb.asia-southeast1.firebasedatabase.app",projectId:"esp32-29f82",storageBucket:"esp32-29f82.firebasestorage.app",messagingSenderId:"462101934357",appId:"1:462101934357:web:804f8aaade867b40d6791c",measurementId:"G-EVZ76LJC1X"};
const $=id=>document.getElementById(id);let relayRef=null,currentRelayState=false,firebaseStarted=false;let sunrise=null,sunset=null;
function showApp(){$("loginScreen").style.display="none";$("appContent").style.display="block";startClock();startWeather();startFirebase()}
function login(){if($("username").value.trim().toLowerCase()==="greenfield"&&$("password").value==="1234"){sessionStorage.setItem("greenfield_logged_in","1");showApp()}else{$("loginError").textContent="Incorrect username or password";$("password").value=""}}
$("loginButton").onclick=login;$("password").onkeydown=e=>{if(e.key==="Enter")login()};
function startClock(){const tick=()=>$("liveTime").textContent=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});tick();setInterval(tick,1000)}
function updateScene(){const h=new Date().getHours()+new Date().getMinutes()/60;const sr=sunrise?new Date(sunrise).getHours()+new Date(sunrise).getMinutes()/60:5.8;const ss=sunset?new Date(sunset).getHours()+new Date(sunset).getMinutes()/60:18.1;const a=$("appContent");a.classList.remove("morning","day","evening","night");if(h>=sr&&h<sr+1.2)a.classList.add("morning");else if(h>=sr+1.2&&h<ss-1)a.classList.add("day");else if(h>=ss-1&&h<=ss+.8)a.classList.add("evening");else a.classList.add("night")}
function weatherClasses(code,wind){const a=$("appContent");a.classList.remove("cloudy","rainy","storm","windy");if([1,2,3,45,48].includes(code))a.classList.add("cloudy");if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code))a.classList.add("rainy");if([95,96,99].includes(code))a.classList.add("storm");if(wind>=18)a.classList.add("windy")}
function makeRain(n){const r=$("rain");r.innerHTML="";for(let i=0;i<n;i++){const d=document.createElement("span");d.className="drop";d.style.left=Math.random()*100+"%";d.style.animationDuration=(.55+Math.random()*.55)+"s";d.style.animationDelay=(-Math.random()*1.2)+"s";r.appendChild(d)}}
async function startWeather(){async function fetchWeather(){try{const u="https://api.open-meteo.com/v1/forecast?latitude=26.754246&longitude=88.448930&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,is_day&daily=sunrise,sunset&timezone=Asia%2FKolkata&forecast_days=1";const d=await (await fetch(u,{cache:"no-store"})).json();const c=d.current||{};sunrise=d.daily?.sunrise?.[0]||null;sunset=d.daily?.sunset?.[0]||null;const code=Number(c.weather_code||0),wind=Math.round(c.wind_speed_10m||0),temp=Math.round(c.temperature_2m||0),hum=Math.round(c.relative_humidity_2m||0);updateScene();weatherClasses(code,wind);if([51,53,55,56,57,61,63,65,66,67,80,81,82,95,96,99].includes(code))makeRain(code>=95?150:100);else $("rain").innerHTML="";let desc="Clear",icon="☀️";if([1,2,3].includes(code)){desc="Cloudy";icon="☁️"}else if([45,48].includes(code)){desc="Foggy";icon="🌫️"}else if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(code)){desc="Rain";icon="🌧️"}else if([95,96,99].includes(code)){desc="Thunderstorm";icon="⛈️"}$("weather").textContent=`${icon} Siliguri • ${temp}°C • ${desc} • 💧${hum}% • 💨${wind} km/h • LIVE`}catch(e){updateScene();$("weather").textContent="⚠️ Siliguri • Weather unavailable"}}await fetchWeather();setInterval(fetchWeather,300000);setInterval(updateScene,30000)}
function showState(v){currentRelayState=Boolean(v);$("appContent").classList.toggle("lights-on",currentRelayState);$("appContent").classList.toggle("lights-off",!currentRelayState);$("toggleButton").classList.toggle("on",currentRelayState);$("stateDot").classList.toggle("on",currentRelayState);$("stateText").textContent=currentRelayState?"ON":"OFF";if(currentRelayState){const t=new Date().toLocaleTimeString("en-IN",{hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:true});localStorage.setItem("greenfield_last_on",t);$("lastOn").textContent=t}}
function startFirebase(){if(firebaseStarted)return;firebaseStarted=true;try{const app=initializeApp(firebaseConfig);const db=getDatabase(app);relayRef=ref(db,"relay1");onValue(relayRef,s=>{showState(s.exists()?s.val():false);$("connection").textContent="LIVE";$("connection").className="connection live";$("firebaseState").textContent="LIVE";$("message").textContent="Firebase connected • Relay synchronized"},e=>{$("connection").textContent="NOT CONNECTED";$("connection").className="connection offline";$("firebaseState").textContent="OFFLINE";$("message").textContent="Firebase error: "+e.message})}catch(e){console.error(e);$("connection").textContent="NOT CONNECTED";$("connection").className="connection offline";$("firebaseState").textContent="OFFLINE";$("message").textContent="Firebase initialization failed"}}
$("toggleButton").onclick=async()=>{if(!relayRef){$("message").textContent="Firebase is not ready";return}try{$("toggleButton").disabled=true;await set(relayRef,!currentRelayState)}catch(e){$("message").textContent="Command failed: "+e.message}finally{setTimeout(()=>$("toggleButton").disabled=false,500)}};
const saved=localStorage.getItem("greenfield_last_on");if(saved)$("lastOn").textContent=saved;
if(sessionStorage.getItem("greenfield_logged_in")==="1")showApp();else $("loginScreen").style.display="flex";
</script>
</body></html>

/* LIVE WEATHER / DAY-NIGHT VISUAL ENGINE */
.sky{z-index:1;transition:background 2s ease}
.scene{z-index:2}
.app{--sky1:#061712;--sky2:#03100b;transition:background 2s ease}
.app.day{background:linear-gradient(180deg,#72c9e8 0%,#b9e8df 34%,#3d9b68 72%,#07180f 100%)}
.app.sunrise{background:linear-gradient(180deg,#ef8e6e 0%,#f5c878 25%,#78c9b4 48%,#173b28 100%)}
.app.sunset{background:linear-gradient(180deg,#5b315a 0%,#df775e 28%,#efb26a 48%,#123020 100%)}
.app.night{background:linear-gradient(180deg,#020617 0%,#031a1b 42%,#03120c 72%,#020806 100%)}
.sun{position:absolute;width:92px;height:92px;border-radius:50%;left:50%;top:10%;transform:translateX(-50%);background:#fff4a6;box-shadow:0 0 35px 10px rgba(255,224,110,.5),0 0 100px 30px rgba(255,190,60,.18);opacity:0;transition:all 2s ease}
.moon{transition:opacity 2s ease,transform 2s ease}
.app.day .sun{opacity:.95}
.app.sunrise .sun,.app.sunset .sun{opacity:.7}
.app.night .sun{opacity:0}
.app.day .moon,.app.sunrise .moon,.app.sunset .moon{opacity:0}
.app.night .moon{opacity:1}
.stars{position:absolute;inset:0;opacity:0;transition:opacity 2s ease;background-image:radial-gradient(circle at 8% 18%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 20% 30%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 35% 14%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 48% 24%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 65% 12%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 78% 28%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 91% 16%,#fff 0 1px,transparent 1.5px),radial-gradient(circle at 56% 38%,#fff 0 1px,transparent 1.5px)}
.app.night .stars{opacity:.8;animation:starTwinkle 4s ease-in-out infinite alternate}
@keyframes starTwinkle{from{opacity:.45}to{opacity:.95}}
.cloud{z-index:3;opacity:.12;transition:opacity 1.5s ease}
.app.day .cloud{opacity:.5}
.app.sunrise .cloud,.app.sunset .cloud{opacity:.4}
.app.night .cloud{opacity:.18}
.weatherGlow{position:absolute;inset:-20%;pointer-events:none;opacity:0;transition:opacity 2s ease;background:radial-gradient(circle at 50% 30%,rgba(255,220,140,.24),transparent 35%)}
.app.day .weatherGlow{opacity:1}
.rain{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:25;transition:opacity .7s ease;background-image:repeating-linear-gradient(105deg,transparent 0 18px,rgba(185,235,255,.55) 19px 21px,transparent 22px 42px);background-size:80px 120px;animation:rainFall .55s linear infinite}
.app.rain .rain,.app.storm .rain{opacity:.6}
@keyframes rainFall{from{background-position:0 -120px}to{background-position:80px 120px}}
.lightning{position:absolute;inset:0;z-index:26;pointer-events:none;opacity:0;background:rgba(220,245,255,.8)}
.app.storm .lightning{animation:flash 7s infinite}
@keyframes flash{0%,88%,91%,100%{opacity:0}89%{opacity:.65}90%{opacity:.08}}
.app.rain .cloud,.app.storm .cloud{opacity:.75}
.app.rain .moon,.app.storm .moon{opacity:.08}
.app.rain .stars,.app.storm .stars{opacity:.05}
.app.fog:after{content:"";position:absolute;inset:0;z-index:24;pointer-events:none;background:linear-gradient(180deg,rgba(210,230,220,.08),rgba(210,230,220,.22));backdrop-filter:blur(1px)}
.weather-tag{position:absolute;top:58px;left:50%;transform:translateX(-50%);z-index:31;padding:6px 11px;border-radius:20px;background:rgba(3,15,11,.42);border:1px solid rgba(180,255,220,.13);font-size:9px;letter-spacing:.08em;color:#d8f7e9;white-space:nowrap;backdrop-filter:blur(10px);pointer-events:none}
.weather-tag b{color:#fff}

  connection.classList.remove('offline','checking');
  if(mode==='live'){connectionText.textContent='LIVE';return}
  if(mode==='offline'){connection.classList.add('offline');connectionText.textContent='NOT CONNECTED';return}
  connection.classList.add('checking');connectionText.textContent='CHECKING';
}
function setStatus(message,mode='live'){
  status.classList.remove('offline','checking');
  if(mode==='offline')status.classList.add('offline');
  if(mode==='checking')status.classList.add('checking');
  status.innerHTML=message;
}
function render(){
  if(state===null){
    power.textContent='--'; power.style.color='var(--m)';
    toggle.classList.remove('active'); lamps.forEach(x=>x.classList.remove('on')); pools.forEach(x=>x.classList.remove('on')); return;
  }
  toggle.classList.toggle('active',state);
  lamps.forEach(x=>x.classList.toggle('on',state));
  pools.forEach(x=>x.classList.toggle('on',state));
  power.textContent=state?'ON':'OFF';
  power.style.color=state?'var(--g)':'var(--r)';
}
function escapeHTML(v){return v.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}

async function checkRealDeviceStatus(){
  try{
    const url='https://io.adafruit.com/api/v2/'+encodeURIComponent(AIO_USERNAME)+'/feeds/'+encodeURIComponent(STATUS_FEED)+'/data?limit=1';
    const response=await fetch(url,{headers:{'X-AIO-Key':AIO_KEY},cache:'no-store'});
    if(!response.ok)throw new Error('HTTP '+response.status);
    const data=await response.json();
    if(!Array.isArray(data)||!data.length){
      deviceOnline=false;setConnection('offline');setStatus('<strong>Waiting for ESP32 status...</strong>','offline');return;
    }
    const latest=data[0],t=new Date(latest.created_at),age=Date.now()-t.getTime();
    lastDeviceUpdate=t;
    if(!Number.isFinite(age)||age>DEVICE_TIMEOUT){
      deviceOnline=false;setConnection('offline');
      setStatus('<strong>ESP32 not responding</strong><br><span style="opacity:.7">No heartbeat received for more than 45 seconds</span>','offline');return;
    }
    deviceOnline=true;setConnection('live');
    const v=String(latest.value).trim().toUpperCase();
    if(v==='ON')state=true;else if(v==='OFF')state=false;
    else {setStatus('<strong>Invalid device status</strong>','checking');return}
    if(state){
      const t2=t.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
      lastOn.textContent=t2;localStorage.setItem('greenfieldLastOn',t2);
    }
    commandPending=false;toggle.disabled=false;render();
    const sec=Math.max(0,Math.floor(age/1000));
    setStatus(state?'<strong>All streetlights illuminated</strong><br><span style="opacity:.65">ESP32 online • updated '+sec+'s ago</span>':'<strong style="color:var(--r)">Streetlights switched OFF</strong><br><span style="opacity:.65">ESP32 online • updated '+sec+'s ago</span>','live');
  }catch(e){
    console.error(e);setConnection('checking');setStatus('<strong style="color:var(--y)">Checking Adafruit IO connection...</strong>','checking');
  }
}
async function sendCommand(){
  if(state===null)return;
  const value=state?'ON':'OFF'; commandPending=true;toggle.disabled=true;
  setStatus('<strong style="color:var(--y)">Sending '+value+' command...</strong>','checking');
  try{await fetch(WEBHOOK_URL,{method:'POST',body:value,mode:'no-cors'});setStatus('<strong style="color:var(--y)">Command sent • waiting for ESP32...</strong>','checking')}
  catch(e){commandPending=false;toggle.disabled=false;setStatus('<strong style="color:var(--r)">Command could not be sent</strong>','offline')}
  setTimeout(checkRealDeviceStatus,1500);
}
toggle.onclick=()=>{if(toggle.disabled)return;if(state===null){checkRealDeviceStatus();return}state=!state;render();sendCommand()};
render();setConnection('checking');checkRealDeviceStatus();setInterval(checkRealDeviceStatus,STATUS_CHECK_INTERVAL);

/* LIVE WEATHER ENGINE
   Exact location requested: 26.754508, 88.448859.
   Open-Meteo supplies current weather, is_day, wind and weather code,
   plus sunrise/sunset astronomical data. */
const WEATHER_LAT=26.754508, WEATHER_LON=88.448859;
const weatherTag=document.getElementById('weatherTag');
const app=document.querySelector('.app');

function weatherName(code){
  if(code===0)return 'CLEAR';
  if([1,2,3].includes(code))return 'CLOUDY';
  if([45,48].includes(code))return 'FOG';
  if([51,53,55,56,57].includes(code))return 'DRIZZLE';
  if([61,63,65,66,67,80,81,82].includes(code))return 'RAIN';
  if([71,73,75,77,85,86].includes(code))return 'SNOW';
  if([95,96,99].includes(code))return 'STORM';
  return 'WEATHER';
}
function applyWeather(w){
  const c=w.weather_code, day=!!w.is_day;
  app.classList.remove('day','night','sunrise','sunset','rain','storm','fog');
  let base=day?'day':'night';
  const now=new Date();
  if(w.sunrise&&w.sunset){
    const sr=new Date(w.sunrise),ss=new Date(w.sunset);
    const srDiff=Math.abs(now-sr)/60000, ssDiff=Math.abs(now-ss)/60000;
    if(srDiff<45)base='sunrise';
    if(ssDiff<45)base='sunset';
  }
  app.classList.add(base);
  if([51,53,55,56,57,61,63,65,66,67,80,81,82].includes(c))app.classList.add('rain');
  if([95,96,99].includes(c))app.classList.add('storm');
  if([45,48].includes(c))app.classList.add('fog');

  const name=weatherName(c);
  const temp=(w.temperature_2m!==undefined)?Math.round(w.temperature_2m):'--';
  const wind=(w.wind_speed_10m!==undefined)?Math.round(w.wind_speed_10m):'--';
  weatherTag.innerHTML='LIVE WEATHER • <b>'+name+'</b> • '+temp+'°C • WIND '+wind+' km/h';
}
async function fetchWeather(){
  try{
    const url='https://api.open-meteo.com/v1/forecast?latitude='+WEATHER_LAT+
      '&longitude='+WEATHER_LON+
      '&current=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,wind_direction_10m,is_day'+
      '&daily=sunrise,sunset&timezone=Asia%2FKolkata&forecast_days=1';
    const r=await fetch(url,{cache:'no-store'});
    if(!r.ok)throw new Error('Weather HTTP '+r.status);
    const d=await r.json();
    applyWeather({
      ...d.current,
      sunrise:d.daily?.sunrise?.[0],
      sunset:d.daily?.sunset?.[0]
    });
  }catch(e){
    console.warn('Weather unavailable',e);
    weatherTag.innerHTML='LIVE WEATHER • <b>OFFLINE</b>';
  }
}
let weatherStarted=false;
function startWeather(){
  if(weatherStarted)return;
  weatherStarted=true;fetchWeather();setInterval(fetchWeather,5*60*1000);
}
startWeather();
</script>
